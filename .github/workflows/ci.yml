name: CI

# Runs on every push to main and to the three personal branches, so you see
# red or green long before Friday's pull request, and on every pull request.
on:
  pull_request:
  push:
    branches: [main, ben, buna, leke]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawler:
    name: Crawler type-check (also guards the manifest contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

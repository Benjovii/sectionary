name: Deploy to AWS

# Builds the web image (web/Dockerfile) on every push to main and pushes it to
# ECR as :latest and :<commit>. App Runner deploys each new :latest by itself.
# Off until the repository variable AWS_DEPLOY_ROLE_ARN is set (docs/AWS.md);
# no AWS keys are stored in GitHub, it signs in through OIDC.
on:
  push:
    branches: [main]
    paths: [web/**, platform/src/**, .dockerignore, .github/workflows/deploy-aws.yml]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and push the web image
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'sectionary-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_BLOCKS_SRC="${{ vars.NEXT_PUBLIC_BLOCKS_SRC }}" \
            --build-arg NEXT_PUBLIC_STORES_SRC="${{ vars.NEXT_PUBLIC_STORES_SRC }}" \
            --build-arg NEXT_PUBLIC_SITES_SRC="${{ vars.NEXT_PUBLIC_SITES_SRC }}" \
            --build-arg NEXT_PUBLIC_ASSET_BASE="${{ vars.NEXT_PUBLIC_ASSET_BASE }}" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
